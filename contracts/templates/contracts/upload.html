<!DOCTYPE html>
<html>
<head>
    <title>Upload Contract</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f7;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
        }

        h1 {
            font-size: 22px;
            color: #1a1a2e;
            margin: 0 0 8px;
        }

        p.subtitle {
            color: #8a8a9a;
            font-size: 14px;
            margin: 0 0 28px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a4a5a;
            margin-bottom: 6px;
            margin-top: 18px;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d0d0d8;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-color: #4f46e5;
            outline: none;
        }

        button {
            width: 100%;
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            margin-top: 24px;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        ul.errorlist {
            color: #d33;
            font-size: 13px;
            padding-left: 18px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Upload a Contract</h1>
        <p class="subtitle">Upload a PDF to start asking questions about it</p>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <label for="{{ form.title.id_for_label }}">Title</label>
            {{ form.title }}
            {{ form.title.errors }}

            <label for="{{ form.file.id_for_label }}">Contract PDF</label>
            {{ form.file }}
            {{ form.file.errors }}

            <button type="submit">Upload &amp; Process</button>
        </form>
    </div>
</body>
</html>
