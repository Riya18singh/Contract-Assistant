<!DOCTYPE html>
<html>
<head>
    <title>Chat with {{ contract.title }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f7;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: #1a1a2e;
            color: white;
            padding: 20px 30px;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        header p {
            margin: 4px 0 0;
            font-size: 13px;
            color: #a0a0b0;
        }

        .chat-area {
            flex: 1;
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 16px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.ai {
            align-items: flex-start;
        }

        .bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 15px;
        }

        .message.user .bubble {
            background: #4f46e5;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai .bubble {
            background: white;
            color: #1a1a2e;
            border: 1px solid #e0e0e5;
            border-bottom-left-radius: 4px;
        }

        .empty-state {
            text-align: center;
            color: #9090a0;
            margin-top: 60px;
            font-size: 14px;
        }

        form {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            gap: 8px;
            box-sizing: border-box;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d0d0d8;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #4f46e5;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>
    <header>
        <h1>{{ contract.title }}</h1>
        <p>Ask anything about this contract</p>
    </header>

    <div class="chat-area">
        {% if question %}
            <div class="message user">
                <div class="bubble">{{ question }}</div>
            </div>
            <div class="message ai">
                <div class="bubble">{{ answer }}</div>
            </div>
        {% else %}
            <div class="empty-state">No questions yet — ask something below to get started.</div>
        {% endif %}
    </div>

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="question" placeholder="Ask a question about this contract..." autofocus>
        <button type="submit">Ask</button>
    </form>
</body>
</html>
