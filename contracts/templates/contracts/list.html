<!DOCTYPE html>
<html>
<head>
    <title>My Contracts</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f7;
            margin: 0;
            padding: 0;
        }

        header {
            background: #1a1a2e;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        header a {
            background: #4f46e5;
            color: white;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 16px;
        }

        .contract-card {
            background: white;
            border: 1px solid #e0e0e5;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }

        .contract-card:hover {
            border-color: #4f46e5;
        }

        .contract-title {
            font-weight: 600;
            font-size: 15px;
            color: #1a1a2e;
        }

        .contract-date {
            font-size: 13px;
            color: #8a8a9a;
            margin-top: 2px;
        }

        .empty-state {
            text-align: center;
            color: #9090a0;
            margin-top: 60px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Contracts</h1>
        <a href="{% url 'upload' %}">+ Upload New</a>
    </header>

    <div class="container">
        {% if contracts %}
            {% for contract in contracts %}
                <a class="contract-card" href="{% url 'chat' contract.id %}">
                    <div>
                        <div class="contract-title">{{ contract.title }}</div>
                        <div class="contract-date">Uploaded {{ contract.uploaded_at|date:"M d, Y" }}</div>
                    </div>
                    <span>&rarr;</span>
                </a>
            {% endfor %}
        {% else %}
            <div class="empty-state">No contracts uploaded yet. <a href="{% url 'upload' %}">Upload your first one</a>.</div>
        {% endif %}
    </div>
</body>
</html>
